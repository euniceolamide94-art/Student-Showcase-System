{% load static %}

<!DOCTYPE html>
<html>

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Login</title>

    <link rel="stylesheet" href="{% static 'css/style.css' %}">

</head>

<body class="auth-page">

    <div class="auth-container">

        <div class="auth-card">

            <div class="auth-header">

                <h1>
                    Student Showcase
                </h1>

                <p>
                    Student Login
                </p>

            </div>


            {% if messages %}

                <div class="messages">

                    {% for message in messages %}

                        <p>
                            {{ message }}
                        </p>

                    {% endfor %}

                </div>

            {% endif %}


            <form method="POST">

                {% csrf_token %}


                <div class="form-group">

                    <label for="username">
                        Username
                    </label>

                    <input
                        type="text"
                        id="username"
                        name="username"
                        placeholder="Enter your username"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="auth-button"
                >
                    Login
                </button>

            </form>


            <p class="auth-footer">

                Don't have an account?

                <a href="/accounts/register/">
                    Register here
                </a>

            </p>

        </div>

    </div>

</body>

</html>
